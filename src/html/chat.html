<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Among Us Legacy UI - 2020</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root {
            --legacy-green: #4b6352; /* El verde oliva de la tienda antigua */
            --legacy-dark: #2c3e33;
            --legacy-border: #1a1a1a;
            --btn-white: #ffffff;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #000;
            font-family: 'VT323', monospace;
            overflow: hidden;
            color: white;
        }

        /* FONDO ESPACIAL */
        .stars {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a2a24 0%, #000 100%);
            z-index: -2;
        }

        .main-menu {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh;
        }

        /* LOGO */
        .logo {
            font-family: 'Fredoka One', cursive;
            font-size: 90px;
            -webkit-text-stroke: 3px black;
            text-shadow: 6px 6px 0px #333;
            margin-bottom: 30px;
        }

        /* BOTONES PRINCIPALES */
        .btn-group { display: flex; flex-direction: column; gap: 15px; width: 320px; }

        .btn-au {
            background: white;
            border: 5px solid black;
            border-radius: 50px;
            padding: 12px;
            font-size: 30px;
            color: black;
            font-family: 'Fredoka One', cursive;
            cursor: pointer;
            box-shadow: inset -5px -7px 0px #999;
            transition: 0.1s;
        }

        .btn-au:active { transform: scale(0.96); }

        /* --- VENTANAS (MODALES) --- */
        .modal {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 6px solid black; border-radius: 20px;
            display: none; z-index: 100;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* TIENDA VERDE LEGACY */
        .shop-legacy {
            width: 600px; background: var(--legacy-green);
        }

        .shop-header {
            background: var(--legacy-dark);
            display: flex; padding: 15px;
            border-bottom: 5px solid black;
            border-radius: 14px 14px 0 0;
        }

        .tab {
            padding: 8px 20px; background: #3d5043;
            border: 3px solid black; color: #aaa;
            margin-right: 10px; font-size: 18px; cursor: pointer;
        }

        .tab.active { background: #6b8c75; color: white; border-bottom: none; }

        .shop-grid {
            padding: 20px; display: grid; 
            grid-template-columns: repeat(4, 1fr); gap: 10px;
            background: rgba(0,0,0,0.2); margin: 15px; border-radius: 10px;
        }

        .item {
            background: #5a7562; border: 3px solid black;
            height: 90px; display: flex; align-items: center;
            justify-content: center; font-size: 40px; border-radius: 8px;
        }

        /* CÓMO JUGAR (HOW TO PLAY) */
        .how-to-play {
            width: 700px; height: 450px;
            background: #222; border-color: #444;
            display: none; flex-direction: column; align-items: center;
            padding: 20px;
        }

        .slide-content {
            flex-grow: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
        }

        .slide-img {
            width: 80%; height: 200px; background: #333;
            border: 4px solid #555; margin-bottom: 15px;
            display: flex; align-items: center; justify-content: center; font-size: 50px;
        }

        .nav-arrows {
            width: 100%; display: flex; justify-content: space-between;
            position: absolute; top: 50%; transform: translateY(-50%);
        }

        .arrow {
            background: none; border: none; color: white;
            font-size: 60px; cursor: pointer; padding: 0 20px;
        }

        .close-btn {
            position: absolute; right: -15px; top: -15px;
            width: 45px; height: 45px; background: #ff4747;
            border: 4px solid black; border-radius: 50%;
            color: white; font-size: 25px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="main-menu">
        <div class="logo">AMONG US</div>
        
        <div class="btn-group">
            <button class="btn-au" style="padding: 20px; font-size: 45px;">ONLINE</button>
            <button class="btn-au" onclick="openModal('howToModal')">HOW TO PLAY</button>
            <button class="btn-au" onclick="openModal('shopModal')">PETS & SKINS</button>
        </div>
    </div>

    <!-- TIENDA VERDE -->
    <div id="shopModal" class="modal shop-legacy">
        <button class="close-btn" onclick="closeModal('shopModal')">X</button>
        <div class="shop-header">
            <div class="tab">SKINS</div>
            <div class="tab active">PETS</div>
            <div class="tab">HATS</div>
        </div>
        <div class="shop-grid">
            <div class="item">🐕</div>
            <div class="item">👶</div>
            <div class="item">👽</div>
            <div class="item">🤖</div>
            <div class="item">🐹</div>
            <div class="item">🧠</div>
            <div class="item">🐌</div>
            <div class="item">🦀</div>
        </div>
        <div style="text-align:center; padding-bottom:15px; color:#c7decb;">LEGACY BUNDLE - $2.99</div>
    </div>

    <!-- CÓMO JUGAR -->
    <div id="howToModal" class="modal how-to-play">
        <button class="close-btn" onclick="closeModal('howToModal')">X</button>
        <div class="nav-arrows">
            <button class="arrow">◀</button>
            <button class="arrow">▶</button>
        </div>
        <div class="slide-content">
            <h2 style="font-family: 'Fredoka One';">CREWMATE</h2>
            <div class="slide-img">🔪❌</div>
            <p style="font-size: 24px; max-width: 80%;">Complete tasks to fill the gauge!<br>Watch out for the Impostor!</p>
        </div>
    </div>

    <script>
        function openModal(id) {
            document.getElementById(id).style.display = (id === 'howToModal') ? 'flex' : 'block';
        }
        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }
    </script>
</body>
</html>
