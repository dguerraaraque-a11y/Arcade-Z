<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Snake Z | Toxic Edition</title>
    <style>
        :root {
            --neon: #32ff7e;
            --danger: #ff4d4d;
            --toxic: #bf00ff;
            --bg: #0a0a0c;
            --panel: #16161a;
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-wrapper {
            display: flex;
            gap: 20px;
            padding: 25px;
            background: var(--panel);
            border-radius: 30px;
            border: 1px solid #333;
            box-shadow: 0 0 100px rgba(0,0,0,0.9);
        }

        .stats-panel {
            width: 200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .stat-card {
            background: #222;
            padding: 15px;
            border-radius: 15px;
            border-bottom: 4px solid var(--neon);
        }

        .stat-card small { color: #888; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card div { font-size: 26px; font-weight: 900; font-family: monospace; }

        #game-container {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
            border: 3px solid #333;
        }

        canvas { display: block; background: #000; }

        #ui-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 30px;
        }

        .menu-title { font-size: 45px; font-weight: 900; color: var(--neon); text-shadow: 0 0 20px var(--neon); margin-bottom: 25px; }

        select, button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 14px;
        }

        select { background: #222; color: white; border: 1px solid #444; cursor: pointer; }

        .btn-play {
            background: var(--neon);
            color: black;
            font-size: 20px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .btn-play:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(50, 255, 126, 0.4); }
        
        .mode-desc { font-size: 13px; color: #888; margin-bottom: 15px; height: 35px; text-align: center; font-style: italic; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div class="stats-panel">
            <div class="stat-card">
                <small>Puntos</small>
                <div id="score">000</div>
            </div>
            <div class="stat-card" style="border-bottom-color: #555;">
                <small>Máximo</small>
                <div id="best">000</div>
            </div>
            <div id="mode-info" style="color: var(--toxic); font-weight: bold; font-size: 12px; text-align: center; text-transform: uppercase;">Modo: Clásico</div>
        </div>

        <div id="game-container">
            <div id="ui-overlay">
                <div class="menu-title">SNAKE Z</div>
                
                <select id="diff">
                    <option value="12">Dificultad: Normal</option>
                    <option value="18">Dificultad: Agente</option>
                    <option value="28">Dificultad: Extrema</option>
                </select>

                <select id="mode" onchange="updateDesc()">
                    <option value="classic">Modo Clásico</option>
                    <option value="toxic">Modo Veneno ☣️</option>
                    <option value="flash">Modo Flash ⚡</option>
                    <option value="ghost">Modo Fantasma 👻</option>
                    <option value="mirror">Modo Espejo 🪞</option>
                </select>
                <div class="mode-desc" id="desc">Recoge manzanas rojas y sobrevive.</div>

                <button class="btn-play" onclick="initGame()">Comenzar Misión</button>
            </div>
            <canvas id="c" width="500" height="500"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('ui-overlay');
        
        let gs = 25, tc = 20;
        let px, py, ax, ay, vx, vy, trail, tail, score, loop;
        let tx, ty; // Coordenadas veneno
        let currentMode = 'classic';
        let highScore = localStorage.getItem('snakeBest') || 0;

        document.getElementById('best').innerText = highScore.toString().padStart(3, '0');

        function updateDesc() {
            const m = document.getElementById('mode').value;
            const d = {
                classic: "El reto original. No choques con nada.",
                toxic: "¡Cuidado! El veneno morado te encoge y quita puntos.",
                flash: "Velocidad sónica. Cada manzana te frena un poco.",
                ghost: "Puedes atravesar tu cuerpo, ¡pero no las paredes!",
                mirror: "Controles invertidos. Tu cerebro va a explotar."
            };
            document.getElementById('desc').innerText = d[m];
        }

        function initGame() {
            let speed = parseInt(document.getElementById('diff').value);
            currentMode = document.getElementById('mode').value;
            ui.style.display = 'none';
            document.getElementById('mode-info').innerText = "MODO: " + currentMode;

            px = 10; py = 10; vx = 1; vy = 0;
            tail = 5; trail = []; score = 0;
            updateScore();

            spawnApple();
            spawnPoison();

            if(loop) clearInterval(loop);
            loop = setInterval(draw, 1000 / (currentMode === 'flash' ? speed * 2 : speed));
        }

        function spawnApple() {
            ax = Math.floor(Math.random() * tc);
            ay = Math.floor(Math.random() * tc);
        }

        function spawnPoison() {
            tx = Math.floor(Math.random() * tc);
            ty = Math.floor(Math.random() * tc);
        }

        function updateScore() {
            document.getElementById('score').innerText = score.toString().padStart(3, '0');
        }

        function draw() {
            px += vx; py += vy;

            // Paredes
            if(px < 0 || px > tc-1 || py < 0 || py > tc-1) return gameOver();

            // Fondo con efecto rejilla suave
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Manzana Roja
            ctx.shadowBlur = 15; ctx.shadowColor = "red";
            ctx.fillStyle = "red";
            ctx.fillRect(ax*gs+2, ay*gs+2, gs-4, gs-4);

            // Veneno (Solo en modo toxic)
            if(currentMode === 'toxic') {
                ctx.shadowColor = "#bf00ff";
                ctx.fillStyle = "#bf00ff";
                ctx.fillRect(tx*gs+4, ty*gs+4, gs-8, gs-8);
            }

            // Serpiente
            ctx.shadowBlur = 10; ctx.shadowColor = "#32ff7e";
            trail.forEach((t, i) => {
                ctx.fillStyle = (i === trail.length-1) ? "#32ff7e" : "#1db954";
                ctx.fillRect(t.x*gs+1, t.y*gs+1, gs-2, gs-2);
                
                // Colisión con cuerpo (Excepto en modo Ghost)
                if(t.x == px && t.y == py && currentMode !== 'ghost') gameOver();
            });

            trail.push({x:px, y:py});
            while(trail.length > tail) trail.shift();

            // Comer Manzana
            if(ax == px && ay == py) {
                tail++; score += 10;
                updateScore();
                spawnApple();
                if(currentMode === 'toxic') spawnPoison();
            }

            // Comer Veneno
            if(currentMode === 'toxic' && tx == px && ty == py) {
                tail = Math.max(2, tail - 2);
                score = Math.max(0, score - 15);
                updateScore();
                spawnPoison();
                if(tail <= 2 && score === 0) gameOver();
            }
        }

        function gameOver() {
            clearInterval(loop);
            if(score > highScore) {
                highScore = score;
                localStorage.setItem('snakeBest', highScore);
            }
            ui.innerHTML = `
                <div class="menu-title" style="color:var(--danger)">MISIÓN FALLIDA</div>
                <div style="font-size:20px; margin-bottom:10px;">Puntaje: ${score}</div>
                <button class="btn-play" onclick="location.reload()">Reiniciar Sistema</button>
            `;
            ui.style.display = 'flex';
        }

        window.addEventListener("keydown", e => {
            let k = e.keyCode;
            if(currentMode === 'mirror') {
                if(k == 37) k = 39; else if(k == 39) k = 37;
                else if(k == 38) k = 40; else if(k == 40) k = 38;
            }
            switch(k) {
                case 37: if(vx !== 1) {vx=-1; vy=0;} break;
                case 38: if(vy !== 1) {vx=0; vy=-1;} break;
                case 39: if(vx !== -1) {vx=1; vy=0;} break;
                case 40: if(vy !== -1) {vx=0; vy=1;} break;
            }
        });
    </script>
</body>
</html>
