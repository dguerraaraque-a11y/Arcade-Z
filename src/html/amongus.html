<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Among Us | Arcade-Z</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/vcr-osd-mono" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/amongus.css?v=2">
</head>
<body>

    <!-- El contenido del juego ahora es el único elemento en el body -->
            <div id="game-vp" class="viewport-container">
                <!-- GAME CONTENT -->
                <div id="top-hud">
                    <div class="name-box" onclick="changeName()">PLAYER</div>
                    <div class="chat-btn-top" onclick="toggleChat()">💬</div>
                </div>
                
                <div id="task-list" class="task-list" style="display:none;">
                    <div class="task-progress-container">
                        <div class="task-progress-label">Total Tasks Completed</div>
                        <div class="progress-bar"><div id="total-progress" class="progress-fill"></div></div>
                    </div>
                    <div id="my-tasks"></div>
                </div>

                <div id="btn-settings-top" class="settings-btn-top" onclick="toggleSettings()">⚙</div>

                <canvas id="game-canvas"></canvas>

                <div id="ui-layer">
                    <div class="logo-container">
                        <div class="logo-text">AMONG US</div>
                    </div>

                    <div class="main-buttons">
                        <button id="play-btn-main" class="btn-main online" onclick="showModeSelect()">JUGAR</button>
                    </div>

                    <div class="bottom-nav">
                        <div class="btn-circle" title="Anuncios"><i class="fas fa-bullhorn"></i></div>
                        <div class="btn-circle" title="Estadísticas"><i class="fas fa-chart-bar"></i></div>
                        <div class="btn-circle" title="Ajustes"><i class="fas fa-cog"></i></div>
                        <div class="btn-circle" title="Tienda"><i class="fas fa-shopping-cart"></i></div>
                        <div class="btn-circle" style="background:#ff4747;" title="Salir" onclick="window.location.href='../../index.html'"><i class="fas fa-times"></i></div>
                    </div>
                </div>

                <div class="region-hud">
                    <div class="region-icon">🌎</div>
                    <span style="font-size: 12px;">North America</span>
                </div>

                <div class="version-info">v17.0.0i</div>
                <div id="sabotage-alert" class="sabotage-alert">CRITICAL FAILURE</div>
                <div id="arrow-guide" class="arrow-guide"></div>
                <!-- END GAME CONTENT -->

                <!-- GAME MODE SELECT -->
                <div id="mode-select-overlay" class="menu-overlay">
                    <div class="menu-box">
                        <div class="logo-text" style="font-size: 60px; text-align: center; margin-bottom: 10px;">JUGAR</div>
                        <button class="btn-main" onclick="enterLobby('normal')">CLÁSICO</button>
                        <button class="btn-main" style="background: #9b59b6; color: white;" onclick="enterLobby('hide_seek')">ESCONDITE</button>
                        <button class="btn-main btn-back" onclick="showMainMenu()">ATRAS</button>
                    </div>
                </div>

                <div id="lobby-ui" class="lobby-ui" style="display: none;">
                    <button class="lobby-btn customize" onclick="openCustomize()">CUSTOMIZE</button>
                    <button class="lobby-btn start" onclick="startMatch()">START</button>
                </div>

                <!-- IN-GAME HUD -->
                <div id="game-hud" class="role-hud" style="display: none; align-items: flex-end;">
                    <div id="btn-report" class="action-circle report" onclick="reportBody()"><i class="fas fa-bullhorn"></i>REPORT</div>
                    <div id="btn-use" class="action-circle use" onclick="interact()"><i class="fas fa-hand-paper"></i>USE</div>
                    <div id="btn-kill" class="action-circle kill" style="display:none;" onclick="killTarget()"><i class="fas fa-skull"></i>KILL
                        <div id="kill-cd" class="cooldown-overlay" style="display:none;">10</div>
                    </div>
                    <div id="btn-sabotage" class="action-circle sabotage" style="display:none;" onclick="toggleSabotageMap()"><i class="fas fa-bolt"></i>SABO</div>
                    <div id="btn-vent" class="action-circle vent" style="display:none;" onclick="toggleVent()"><i class="fas fa-wind"></i>VENT</div>
                    <div id="btn-shift" class="action-circle" style="display:none; border-color:#ffafcc; color:#ffafcc;" onclick="toggleShift()"><i class="fas fa-egg"></i>SHIFT</div>
                    <div id="btn-vitals" class="action-circle vitals" style="display:none;" onclick="toggleVitals()">❤</div>
                    <div id="btn-protect" class="action-circle protect" style="display:none;" onclick="protectTarget()">🛡️</div>
                    <div id="btn-cams" class="action-circle" style="display:none; border-color:#95a5a6; color:#95a5a6;" onclick="toggleCameras()">📷</div>
                    <div id="btn-map" class="map-btn" onclick="toggleMap()"><i class="fas fa-map"></i></div>
                </div>

                <!-- SETTINGS UI -->
                <div id="settings-overlay" class="task-overlay">
                    <div class="settings-box">
                        <div class="task-header">
                            <span>SETTINGS</span>
                            <span class="close-task" onclick="toggleSettings()">✖</span>
                        </div>
                        <div class="settings-content">
                            <div class="setting-row"><span>Music</span><input type="range" onchange="updateVolume('music', this.value)"></div>
                            <div class="setting-row"><span>SFX</span><input type="range" onchange="updateVolume('sfx', this.value)"></div>
                            <button class="btn-main" onclick="location.reload()">LEAVE GAME</button>
                        </div>
                    </div>
                </div>

                <!-- TASK UI -->
                <div id="task-overlay" class="task-overlay">
                    <div class="task-box">
                        <div class="task-header">
                            <span id="task-title">TASK</span>
                            <span class="close-task" onclick="closeTask()">✖</span>
                        </div>
                        <div id="task-content" class="task-content"></div>
                    </div>
                </div>

                <!-- VOTING UI -->
                <div id="voting-screen" class="voting-screen">
                    <div class="voting-header">EMERGENCY MEETING</div>
                    <div class="players-grid" id="voting-grid"></div>
                    <div class="skip-btn" onclick="castVote(null)">SKIP VOTE</div>
                </div>
                <div id="shift-cloud" class="shift-cloud"></div>

                <!-- VITALS UI -->
                <div id="vitals-screen" class="vitals-screen">
                    <div style="color:white; font-family:var(--font-official); font-size:30px; text-align:center; margin-bottom:20px;">VITALS MONITOR</div>
                    <div id="vitals-list"></div>
                    <button onclick="toggleVitals()" style="margin-top:auto; padding:10px; background:#333; color:white; border:none; cursor:pointer;">CLOSE</button>
                </div>

                <!-- CAMS UI -->
                <div id="cams-screen" class="cams-overlay">
                    <div class="cam-view" id="cam-viewport">
                        <div class="rec-dot"></div>
                        <div style="position:absolute; top:20px; right:20px; color:white; font-family:var(--font-official); font-size:24px;" id="cam-label">CAM 1</div>
                        <canvas id="cam-canvas" style="width:100%; height:100%;"></canvas>
                    </div>
                    <div class="cam-controls" id="cam-buttons"></div>
                </div>

                <div id="map-overlay" class="map-overlay" onclick="toggleMap()">
                    <img src="../../assets/AmongUs Assets/skeld_map.png" class="map-image">
                    <div id="map-player-dot" style="position:absolute; width:10px; height:10px; background:red; border-radius:50%; border:2px solid white;"></div>
                </div>

                <div id="sabotage-map" class="sabotage-map"></div>

                <!-- CUSTOMIZE OVERLAY -->
                <div id="customize-overlay" class="task-overlay">
                    <div class="task-box" style="height: 550px;">
                        <div class="task-header">
                            <span>PERSONALIZAR</span>
                            <span class="close-task" onclick="closeCustomize()">✖</span>
                        </div>
                        <div class="task-content" style="padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto;">
                            <div class="cust-tabs">
                                <button class="cust-tab active" onclick="switchCustTab('color')">COLOR</button>
                                <button class="cust-tab" onclick="switchCustTab('hat')">HAT</button>
                                <button class="cust-tab" onclick="switchCustTab('pet')">PET</button>
                                <button class="cust-tab" onclick="switchCustTab('role')">ROLE</button>
                            </div>
                            <div id="cust-content"></div>

                            <div id="selected-role-display" style="color: var(--accent); font-family: var(--font-official); font-size: 20px; margin-top: auto; text-align: center;">ROL: ALEATORIO</div>
                        </div>
                    </div>
                </div>

                <!-- CHAT OVERLAY -->
                <div id="chat-overlay" class="chat-overlay">
                    <div class="chat-box">
                        <div class="chat-header">CHAT <span style="cursor:pointer" onclick="toggleChat()">✖</span></div>
                        <div class="chat-messages" id="chat-messages"></div>
                        <div class="chat-input-area"><input type="text" id="chat-input" placeholder="Say something..."><button onclick="sendChat()" style="padding:5px 15px; background:#2ecc71; border:none; color:white; font-weight:bold; cursor:pointer;">SEND</button></div>
                    </div>
                </div>

                <!-- CINEMATICS LAYER -->
                <div id="cinematic-overlay" class="cinematic-overlay" style="display: none;">
                    <div id="shh-content" class="cinematic-content">
                        <div class="shh-text">SHHHHHHH!</div>
                        <canvas id="shh-canvas" width="300" height="300"></canvas>
                    </div>
                    <div id="role-content" class="cinematic-content" style="display: none;">
                        <div id="role-bg" style="position:absolute; width:100%; height:100%; background: radial-gradient(circle, rgba(0,0,0,0) 0%, #000 100%); opacity: 0.8;"></div>
                        <div id="role-title" class="role-title" style="transform: scale(3); opacity: 0;">TRIPULANTE</div>
                        <div id="role-subtitle" class="role-subtitle">Hay <span id="impostor-count">2</span> Impostores entre nosotros</div>
                        <canvas id="role-canvas" width="800" height="400" style="margin-top: 30px;"></canvas>
                    </div>
                    <div id="eject-content" class="cinematic-content" style="display: none;">
                        <canvas id="eject-canvas" width="800" height="400"></canvas>
                        <div id="eject-text" class="eject-text"></div>
                    </div>
                    <div id="death-content" class="cinematic-content" style="display: none; background: #000;">
                        <canvas id="death-canvas" width="800" height="600"></canvas>
                    </div>
                    <!-- REPORT ANIMATION -->
                    <div id="report-content" class="cinematic-content" style="display: none;">
                        <canvas id="report-canvas" width="800" height="600"></canvas>
                        <div id="report-text" class="shh-text" style="font-size: 80px; color: white; text-shadow: 4px 4px 0 #000;"></div>
                    </div>
                </div>
            </div>
    <!-- Fin del contenido del juego -->

    <script src="../js/avatar.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/chat.js"></script>
    <script src="../js/amongus.js"></script>

</body>
</html>
